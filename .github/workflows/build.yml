name: Build Lc0 Optimized

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential meson ninja-build protobuf-compiler \
            libprotobuf-dev libboost-all-dev libopenblas-dev libblas-dev \
            libasio-dev upx

    - name: Create build directory
      run: mkdir -p build

    - name: Configure Meson (size optimized)
      run: |
        meson setup build --buildtype=release -Db_lto=true -Db_vscrt=md

    - name: Build with Ninja
      run: |
        cd build
        meson compile

    - name: Strip and compress binary
      run: |
        strip build/lc0
        upx --best build/lc0 || true

    - name: Get file size
      run: ls -lh build/lc0

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lc0-binary
        path: build/lc0
        retention-days: 30
