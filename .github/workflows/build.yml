name: Build Lc0 Optimized

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake protobuf-compiler \
            libprotobuf-dev libboost-all-dev libopenblas-dev libblas-dev \
            libasio-dev upx

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake (size optimized)
      run: |
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Os -s" ..

    - name: Build with Make
      run: |
        cd build
        make -j$(nproc)

    - name: Strip and compress binary
      run: |
        cd build
        strip lc0
        upx --best lc0 || true

    - name: Get file size
      run: ls -lh build/lc0

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lc0-binary
        path: build/lc0
        retention-days: 30
